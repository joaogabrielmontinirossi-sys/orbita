<title>Órbita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: palco quadrado de anéis à esquerda, painel de leitura e edição à direita; no celular, empilha.
   Cor = distância do centro: brasa no agora, esfriando até o azul do que pode esperar. */
:root{
  --bg:#EDF0F3; --surface:#F9FBFC; --ink:#16202B; --muted:#5A6876; --line:#D2D9E0;
  --r0:#DD4F27; --r1:#D9921F; --r2:#23917F; --r3:#566FB3; --r4:#8A5BC2; --r5:#C8477F; --on-accent:#FFFFFF;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#18222C; --ink:#E7ECF1; --muted:#95A3B1; --line:#2B3744;
  --r0:#FF7A4F; --r1:#F2B552; --r2:#4CC2B1; --r3:#8CA4E6; --r4:#B693EA; --r5:#EE86B0; --on-accent:#1B0D06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#18222C; --ink:#E7ECF1; --muted:#95A3B1; --line:#2B3744;
  --r0:#FF7A4F; --r1:#F2B552; --r2:#4CC2B1; --r3:#8CA4E6; --r4:#B693EA; --r5:#EE86B0; --on-accent:#1B0D06; color-scheme:dark}

:root{--g0:var(--r0);--g1:var(--r1);--g2:var(--r2);--g3:var(--r3);--g4:var(--r4);--g5:var(--r5)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--r3);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 48px;display:flex;flex-direction:column;gap:20px}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:46px;height:46px;flex:none}
.logo .o3{stroke:var(--r3)} .logo .o2{stroke:var(--r2)} .logo .o1{stroke:var(--r1)}
.logo .d3{fill:var(--r3)} .logo .d2{fill:var(--r2)} .logo .d1{fill:var(--r1)} .logo .core{fill:var(--r0)}
.logo circle[class^="d"]{stroke:var(--bg);stroke-width:2}
.logo g{transform-origin:32px 32px}
@media (prefers-reduced-motion:no-preference){
  .logo .g3{animation:spin 48s linear infinite}
  .logo .g2{animation:spin 30s linear infinite reverse}
  .logo .g1{animation:spin 18s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{font-size:12px;color:var(--muted);min-width:0}

/* grade principal */
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.stagewrap{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
#stage{width:100%;max-width:640px;aspect-ratio:1;display:block;touch-action:manipulation}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:0}
.calnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* anéis */
.band{stroke:var(--bg);stroke-width:4;cursor:pointer}
.b0{fill:color-mix(in srgb,var(--g0) 30%,var(--surface))}
.b1{fill:color-mix(in srgb,var(--g1) 24%,var(--surface))}
.b2{fill:color-mix(in srgb,var(--g2) 18%,var(--surface))}
.b3{fill:color-mix(in srgb,var(--g3) 14%,var(--surface))}
.b4{fill:color-mix(in srgb,var(--g4) 12%,var(--surface))}
.b5{fill:color-mix(in srgb,var(--g5) 10%,var(--surface))}
.band.on.b0{stroke:var(--g0)} .band.on.b1{stroke:var(--g1)} .band.on.b2{stroke:var(--g2)} .band.on.b3{stroke:var(--g3)} .band.on.b4{stroke:var(--g4)} .band.on.b5{stroke:var(--g5)}
.rlab{font:600 14px var(--body);letter-spacing:.14em;fill:var(--ink);pointer-events:none;text-transform:uppercase}
.empty{font:500 17px var(--body);fill:var(--muted);pointer-events:none;text-anchor:middle}
.bub{cursor:pointer}
.bub circle.c{fill:var(--surface);stroke-width:3}
.bub.k0 circle.c{stroke:var(--g0)} .bub.k1 circle.c{stroke:var(--g1)} .bub.k2 circle.c{stroke:var(--g2)} .bub.k3 circle.c{stroke:var(--g3)} .bub.k4 circle.c{stroke:var(--g4)} .bub.k5 circle.c{stroke:var(--g5)}
.bub.sel circle.c{stroke-width:7}
.bub:hover circle.c{fill:var(--bg)}
.bub text{fill:var(--ink);font-family:var(--body);font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub:focus{outline:none} .bub:focus-visible circle.c{stroke:var(--ink);stroke-width:6}
.duedot{fill:var(--r0);stroke:var(--surface);stroke-width:3}

/* calendário circular */
.day{fill:var(--surface);stroke:var(--bg);stroke-width:2;cursor:pointer}
.day.we{fill:color-mix(in srgb,var(--r3) 14%,var(--surface))}
.day.today{fill:color-mix(in srgb,var(--r0) 30%,var(--surface))}
.day.sel{fill:var(--ink)}
.dnum{font:600 19px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-variant-numeric:tabular-nums}
.dwk{font:500 11px var(--body);fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.onsel{fill:var(--bg)}
.tdot{fill:var(--r0);pointer-events:none}
.dial{fill:var(--surface);stroke:var(--line);stroke-width:1}
.tick{stroke:var(--muted);stroke-width:1.5}
.hlab{font:500 14px var(--body);fill:var(--muted);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.arc{stroke:var(--surface);stroke-width:2}
.arc.done{opacity:.35}
.c0{fill:var(--r1)} .c1{fill:var(--r2)} .c2{fill:var(--r3)} .c3{fill:var(--r0)}
.now{stroke:var(--r0);stroke-width:4;stroke-linecap:round}
.mon{fill:color-mix(in srgb,var(--r2) 12%,var(--surface));stroke:var(--bg);stroke-width:2;cursor:pointer}
.mon.on{fill:var(--r2)}
.mlab{font:600 13px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;text-transform:uppercase;letter-spacing:.06em}
.mlab.on{fill:var(--on-accent)}
.core{fill:var(--bg)}
.cwk{font:600 15px var(--body);fill:var(--muted);text-anchor:middle;letter-spacing:.16em;text-transform:uppercase}
.cnum{font:700 86px var(--display);fill:var(--ink);text-anchor:middle}
.cmon{font:500 18px var(--body);fill:var(--ink);text-anchor:middle}
.csum{font:400 14px var(--body);fill:var(--muted);text-anchor:middle}

/* painel */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.syncbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.syncbox p{margin:0;color:var(--muted)} .syncbox p b{color:var(--ink)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.note{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.note span{flex:1 1 180px;min-width:0}
.sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sechead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:2px 0;text-align:left}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.dot.k0{background:var(--g0)} .dot.k1{background:var(--g1)} .dot.k2{background:var(--g2)} .dot.k3{background:var(--g3)} .dot.k4{background:var(--g4)} .dot.k5{background:var(--g5)}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.step{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.lab{font-size:12px;color:var(--muted);margin:0}
.sechead b{font-family:var(--display);font-weight:500;font-size:15px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.zoom{margin-left:auto;color:var(--muted);font-size:13px}
.preview{color:var(--muted);font-size:13px;margin:0 0 0 24px;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:13px;margin:0}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.item.open{border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;min-width:0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;padding:0}
.chk:hover{border-color:var(--r2)} .chk.on{background:var(--r2);border-color:var(--r2)}
.ttl{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;overflow-wrap:anywhere}
.item.off .ttl{color:var(--muted)}
.meta{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.chip{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{color:var(--r0);font-weight:600}
.edit{display:flex;flex-direction:column;gap:10px;padding:4px 12px 12px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.pair{display:flex;gap:10px;flex-wrap:wrap} .pair label{flex:1 1 110px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-size:15px;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--r0);border-color:var(--r0);color:var(--on-accent);font-weight:600}
.btn.bad{color:var(--r0)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
form.add{display:flex;gap:8px;flex-wrap:wrap}
form.add input[type=text]{flex:1 1 160px}
form.add input[type=time]{flex:0 1 120px}
.none{color:var(--muted);font-size:13px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" fill="none" role="img" aria-label="Logo Órbita">
        <g class="g3"><circle class="o3" cx="32" cy="32" r="28.5" stroke-width="2.2"/><circle class="d3" cx="53.8" cy="13.7" r="4.6"/></g>
        <g class="g2"><circle class="o2" cx="32" cy="32" r="20" stroke-width="2.8"/><circle class="d2" cx="14.7" cy="42" r="3.9"/></g>
        <g class="g1"><circle class="o1" cx="32" cy="32" r="11.5" stroke-width="3.4"/><circle class="d1" cx="40.1" cy="40.1" r="3.2"/></g>
        <circle class="core" cx="32" cy="32" r="5.4"/>
      </svg>
      <div><h1>Órbita</h1><p>O centro é o agora. O resto pode esperar.</p></div>
    </div>
    <div class="tabs" role="group" aria-label="Vista">
      <button id="tab-circles" data-act="view" data-v="circles">Círculos</button>
      <button id="tab-cal" data-act="view" data-v="cal">Calendário</button>
    </div>
    <div class="btns" id="filebtns">
      <button class="btn" id="expbtn" data-act="export">Exportar</button>
      <button class="btn" id="impbtn" data-act="import">Importar</button>
      <button class="btn" id="pdfbtn" data-act="pdf">PDF</button>
      <input type="file" id="imp" accept=".json,application/json" hidden>
      <button class="btn" id="syncbtn" data-act="synctoggle" hidden>Sincronização</button>
    </div>
    <div class="status" id="status" aria-live="polite">Salvo neste navegador</div>
  </header>

  <div class="main">
    <div class="stagewrap">
      <svg id="stage" viewBox="-460 -460 920 920" role="group" aria-label="Círculos de prioridade"></svg>
      <div id="under"></div>
    </div>
    <div class="side">
      <div class="syncbox" id="syncbox" hidden></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="gsync.js" data-app="orbita"></script>
<script src="elo.js" data-app="orbita"></script>
<script>
(function(){
"use strict";
var DEF_RINGS=[
  {name:"Agora",desc:"O que importa neste momento.",color:0},
  {name:"Hoje",desc:"Ainda hoje, depois do que está no centro.",color:1},
  {name:"Esta semana",desc:"Tem prazo, mas não é para hoje.",color:2},
  {name:"Pode esperar",desc:"Sem pressa. Fica aqui até fazer sentido trazer para perto.",color:3}
];
// cores que um anel pode ter: no app vêm dos tokens --r0…--r5 (claro e escuro); no PDF, destes valores
var PALHEX=["#DD4F27","#D9921F","#23917F","#566FB3","#8A5BC2","#C8477F"],PALNAME=["Brasa","Âmbar","Verde-água","Azul","Violeta","Rosa"];
var RINGS=DEF_RINGS,MAXC=3,N=4,BASE=[130,107,107,106],KEY="orbita-v1";
function cleanRings(a){
  if(!Array.isArray(a)||a.length<2)return null;
  return a.slice(0,6).map(function(r){r=r||{};return {name:String(r.name||"").slice(0,24),desc:String(r.desc||"").slice(0,120),color:Math.max(0,Math.min(5,r.color|0))}});
}
function rname(i){return (RINGS[i]&&RINGS[i].name.trim())||("Anel "+(i+1))}
// recalcula tudo o que depende da configuração dos anéis; chamar sempre que o estado ou os anéis mudarem
function useState(){
  RINGS=state.rings;MAXC=state.maxc;N=RINGS.length;
  var c=N<=3?160:130;BASE=RINGS.map(function(_,i){return i?(450-c)/(N-1):c});
  state.tasks.forEach(function(t){t.ring=Math.max(0,Math.min(N-1,t.ring|0))});
  for(var i=0;i<6;i++)document.documentElement.style.setProperty("--g"+i,"var(--r"+(RINGS[i]?RINGS[i].color:i)+")");
}
function centerPos(k,j,R){ // onde fica a j-ésima de k tarefas dentro do disco central de raio R: [x, y, raio]
  if(k===1)return [0,R*.1,Math.min(R*.5,90)];
  if(k===2)return [(j?1:-1)*R*.44,R*.12,R*.37];
  var p=pol(R*.5,90+(k%2?0:180/k)+j*360/k);
  return [p[0],p[1]+R*.06,Math.min(R*.33,R*.5*Math.sin(Math.PI/k)*.88)];
}
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIA=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var DIA3=["dom","seg","ter","qua","qui","sex","sáb"], DIA1=["D","S","T","Q","Q","S","S"];

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){return iso(new Date())}
function dayDiff(s){return Math.round((parse(s)-parse(today()))/864e5)}
function fmtDue(s){var n=dayDiff(s);if(n<0)return "atrasada";if(n===0)return "hoje";if(n===1)return "amanhã";var d=parse(s);return d.getDate()+" "+MES3[d.getMonth()]}
function p2(v){return String(v).padStart(2,"0")}
function dtL(ts){var d=new Date(ts);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" às "+p2(d.getHours())+":"+p2(d.getMinutes())}
function dtS(ts){var d=new Date(ts);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function took(ms){var m=Math.max(0,Math.round(ms/6e4));if(m<60)return m+" min";var h=Math.floor(m/60);if(h<10)return h+" h"+(m%60?" "+(m%60)+" min":"");if(h<48)return h+" h";return Math.round(h/24)+" dias"}
function metaLine(t){
  var a=[];
  if(t.created)a.push("Adicionada em "+dtL(t.created));
  if(t.done&&t.doneAt)a.push("Concluída em "+dtL(t.doneAt));
  else if(t.placed&&t.created&&t.placed-t.created>6e4)a.push("neste anel desde "+dtL(t.placed));
  return a.join(" · ");
}
function hm(min){min=((min%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0")}
function toMin(s){var p=String(s||"0:0").split(":");return (+p[0]||0)*60+(+p[1]||0)}

/* ---------- estado ---------- */
function sample(){
  var t=new Date(), T=function(title,ring,due,notes){return {id:uid(),title:title,notes:notes||"",ring:ring,due:due||"",done:false,doneAt:0,created:t.getTime(),placed:t.getTime(),ex:true}};
  var R=function(title,start,dur,days){return {id:uid(),title:title,start:start,dur:dur,days:days,ex:true}};
  var all=[0,1,2,3,4,5,6], wk=[1,2,3,4,5];
  return {v:1,examples:true,updatedAt:0,log:{},
    tasks:[
      T("Enviar proposta ao cliente",0,iso(t),"Revisar valores e anexar o cronograma antes de enviar."),
      T("Ligar para a contadora",0,"","Perguntar sobre o prazo da declaração."),
      T("Responder e-mails pendentes",1),
      T("Comprar ingredientes do jantar",1,iso(t)),
      T("Revisar apresentação de quinta",1,iso(addDays(t,2))),
      T("Agendar dentista",2),
      T("Pagar boleto do condomínio",2,iso(addDays(t,3))),
      T("Planejar treinos da semana",2),
      T("Ler capítulo 4",2,iso(addDays(t,5))),
      T("Organizar fotos da viagem",3),
      T("Pesquisar curso de inglês",3),
      T("Trocar lâmpada do corredor",3)
    ],
    routines:[
      R("Acordar e alongar","06:30",30,all),
      R("Trabalho focado","09:00",180,wk),
      R("Almoço","12:30",60,all),
      R("Academia","18:30",75,[1,2,3,5]),
      R("Leitura","22:00",45,all),
      R("Planejar a semana","19:00",40,[0])
    ]};
}
function normalize(s){
  if(!s||typeof s!=="object")s=sample();
  s.tasks=Array.isArray(s.tasks)?s.tasks:[]; s.routines=Array.isArray(s.routines)?s.routines:[];
  s.log=s.log&&typeof s.log==="object"?s.log:{};
  s.tomb=s.tomb&&typeof s.tomb==="object"?s.tomb:{};
  s.logMod=s.logMod&&typeof s.logMod==="object"?s.logMod:{};
  s.rings=cleanRings(s.rings)||JSON.parse(JSON.stringify(DEF_RINGS));
  s.maxc=Math.max(1,Math.min(5,(s.maxc|0)||3));
  s.cfgMod=+s.cfgMod||0;

async function syncNow(manual){
  if(!Sync.on&&!GSync.on())return;
  if(Sync.busy){Sync.again=true;return}
  Sync.busy=true;
  try{
    var r=await (Sync.on?api("sync"):GSync.io()); if(!r.ok)throw new Error("não foi possível ler a pasta");
    var text=r.status===200?await r.text():"",remote=text.trim()?JSON.parse(text):null,pulled=0;
    if(remote&&remote.app==="orbita"){
      if(!state.syncedOnce&&state.examples){ // aparelho novo: troca os exemplos pelo que já está no Drive
        state.tasks=state.tasks.filter(function(x){return !x.ex});state.routines=state.routines.filter(function(x){return !x.ex});
        state.examples=false;pulled++;
      }
      pulled+=mergeRemote(remote);
    }
    state.syncedOnce=true;
    if(pulled){snapshot();stamp();persist()}
    var localText=exportData(),local=JSON.parse(localText);
    if(!remote||syncSig(remote)!==syncSig(local)){
      var w=await (Sync.on?api("sync",{method:"POST",body:localText}):GSync.io({method:"POST",body:localText}));
      if(!w.ok)throw new Error("não foi possível gravar na pasta");
    }
    Sync.last=Date.now();Sync.error="";
    if(pulled){
      if(ui.open&&!task(ui.open))ui.open=null;
      if(ui.openR&&!routine(ui.openR))ui.openR=null;
      var ae=document.activeElement,typing=ae&&$("panel").contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName);
      if(ui.view==="circles")cur=targetW();
      drawStage(); if(!typing)drawPanel();
    }
    if(manual)toast(pulled?"Sincronizado: havia novidades no Drive.":"Sincronizado com o Google Drive.");
  }catch(e){
    Sync.error=(e&&e.message)||"erro";
    if(manual)toast("Falha ao sincronizar: "+Sync.error);
  }
  Sync.busy=false;
  setStatus(baseStatus());drawSync();
  if(Sync.again){Sync.again=false;syncSoon()}
}

function wrap(t,cpl,max){
  var words=t.split(/\s+/),lines=[],cur="";
  words.forEach(function(w){var n=cur?cur+" "+w:w;if(n.length<=cpl)cur=n;else{if(cur)lines.push(cur);cur=w}});

  if(cut){var l=lines[max-1];lines[max-1]=(l.length>=cpl?l.slice(0,cpl-1):l)+"…"}
  return lines;
}

  s+='<label>Nome<input type="text" maxlength="24" id="g-name-'+i+'" data-kind="g" data-field="name" data-ring="'+i+'" value="'+esc(r.name)+'" placeholder="Anel '+(i+1)+'"></label>';

  s+='<p class="lab">Cor</p><div class="btns" role="group" aria-label="Cor do anel">';
  for(c=0;c<6;c++)s+='<button class="sw" style="background:var(--r'+c+')" data-act="gcolor" data-ring="'+i+'" data-c="'+c+'" aria-pressed="'+(r.color===c)+'" title="'+PALNAME[c]+'" aria-label="'+PALNAME[c]+'"></button>';
  s+="</div>";
  if(i===0){
    var cnt=inRing(0).length;
    s+='<p class="lab">Quantas tarefas cabem no centro</p><div class="step"><button class="btn" data-act="maxc" data-d="-1"'+(MAXC<=Math.max(1,cnt)?" disabled":"")+' aria-label="Diminuir">−</button><b>'+MAXC+'</b><button class="btn" data-act="maxc" data-d="1"'+(MAXC>=5?" disabled":"")+' aria-label="Aumentar">+</button></div>';
  }
  s+='<div class="btns"><button class="btn" data-act="gadd" data-ring="'+i+'"'+(N>=6?" disabled":"")+">Novo anel depois deste</button>";
  if(i>0)s+='<button class="btn bad" data-act="gdel" data-ring="'+i+'"'+(N<=2?" disabled":"")+">Remover este anel</button>";
  s+='<button class="btn" data-act="greset">Restaurar o padrão</button></div>';
  if(N>=6)s+='<p class="lab">O máximo são 6 anéis.</p>';
  return s+"</div></div>";
}
function cfgChanged(){
  useState();
  inRing(0).slice(MAXC).forEach(function(t){t.ring=1});
  if(ui.focus!==null)ui.focus=Math.min(ui.focus,N-1);
  save();renderAll();
}
function panelCircles(){
  var s=exampleNote();
  s+="<h2>"+(ui.focus===null?"Do centro para fora":esc(rname(ui.focus))+" em detalhe")+"</h2>";
  for(var i=0;i<N;i++){
    var list=inRing(i),open=ui.focus===i;
    s+='<section class="sec"><button class="sechead" data-act="focus" data-ring="'+i+'" aria-expanded="'+open+'"><span class="dot k'+i+'"></span><b data-rname="'+i+'">'+esc(rname(i))+'</b><span class="count">'+list.length+(i===0?" de "+MAXC:"")+'</span><span class="zoom">'+(open?"Reduzir":"Ampliar")+"</span></button>";
    if(open){
      if(RINGS[i].desc)s+='<p class="desc">'+esc(RINGS[i].desc)+"</p>";
      s+=ringEditor(i);
      s+=list.length?'<ul class="list">'+list.map(taskItem).join("")+"</ul>":'<p class="none">Nada aqui por enquanto.</p>';
      s+='<form class="add" data-form="add" data-ring="'+i+'"><input type="text" id="add-'+i+'" placeholder="Nova tarefa em '+esc(rname(i))+'" aria-label="Nova tarefa em '+esc(rname(i))+'"><button class="btn pri">Adicionar</button></form>';
    }else if(list.length){
      s+='<p class="preview">'+list.map(function(t){return esc(t.title)}).join(" · ")+"</p>";
    }
    s+="</section>";
  }
  var done=state.tasks.filter(function(t){return t.done}).sort(function(a,b){return b.doneAt-a.doneAt});
  if(done.length){
    s+='<section class="sec"><h3>Concluídas · '+done.length+'</h3><ul class="list">';
    done.slice(0,40).forEach(function(t){s+='<li class="item off"><div class="row"><button class="chk on" data-act="undo" data-id="'+t.id+'" aria-label="Desfazer '+esc(t.title)+'"></button><span class="ttl">'+esc(t.title)+'<span class="meta">'+metaLine(t)+'</span></span><span class="dot k'+t.ring+'" title="'+esc(rname(t.ring))+'"></span><button class="btn" data-act="undo" data-id="'+t.id+'">Desfazer</button></div></li>'});
    s+="</ul>";
    if(done.length>40)s+='<p class="none">Mostrando as 40 mais recentes. A tabela exportada traz todas.</p>';
    s+='<div class="btns"><button class="btn pri" data-act="pdfdone">Exportar tabela (PDF)</button><button class="btn" data-act="cleardone">Limpar concluídas</button></div></section>';
  }
  return s;
}
function routineItem(r,sel){
  var wd=parse(sel).getDay(),active=r.days.indexOf(wd)>=0,open=ui.openR===r.id,done=isDoneR(r.id,sel);
  var s='<li class="item'+(open?" open":"")+(active?"":" off")+'" id="ir-'+r.id+'"><div class="row">';
  s+=active?'<button class="chk'+(done?" on":"")+'" data-act="rdone" data-id="'+r.id+'" aria-label="Marcar '+esc(r.title)+'"></button>':'<span class="dot" style="width:22px;height:22px;border:2px dotted var(--line)"></span>';
  s+='<button class="ttl" data-act="openr" data-id="'+r.id+'" aria-expanded="'+open+'"><span data-rtl="'+r.id+'">'+esc(r.title)+"</span></button>";
  s+='<span class="chip">'+(active?esc(r.start)+"–"+hm(toMin(r.start)+(+r.dur||0)):r.days.length===7?"todo dia":r.days.slice().sort().map(function(d){return DIA3[d]}).join(", "))+"</span>";
  s+='<span class="dot" style="background:var(--r'+[1,2,3,0][state.routines.indexOf(r)%4]+')"></span></div>';
  if(open){
    s+='<div class="edit"><label>Rotina<input type="text" id="r-title-'+r.id+'" data-kind="r" data-field="title" data-id="'+r.id+'" value="'+esc(r.title)+'"></label>';
    s+='<div class="pair"><label>Começa às<input type="time" id="r-start-'+r.id+'" data-kind="r" data-field="start" data-id="'+r.id+'" value="'+esc(r.start)+'"></label>';
    s+='<label>Duração (min)<input type="number" min="5" max="1440" step="5" id="r-dur-'+r.id+'" data-kind="r" data-field="dur" data-id="'+r.id+'" value="'+esc(r.dur)+'"></label></div>';
    s+='<div class="btns" role="group" aria-label="Dias da semana">';
    for(var d=0;d<7;d++)s+='<button class="btn'+(r.days.indexOf(d)>=0?" on":"")+'" data-act="rday" data-id="'+r.id+'" data-d="'+d+'" aria-pressed="'+(r.days.indexOf(d)>=0)+'">'+DIA3[d]+"</button>";
    s+='</div><div class="btns"><button class="btn bad" data-act="rdel" data-id="'+r.id+'">Excluir rotina</button></div></div>';
  }
  return s+"</li>";
}
function panelCal(){
  var sel=ui.cal.sel,d=parse(sel),s=exampleNote();
  s+="<h2>"+DIA[d.getDay()].charAt(0).toUpperCase()+DIA[d.getDay()].slice(1)+", "+d.getDate()+" de "+MES[d.getMonth()]+(sel===today()?" · hoje":"")+"</h2>";
  var ts=state.tasks.filter(function(t){return !t.done&&t.due===sel});
  s+='<section class="sec"><h3>Tarefas com prazo neste dia</h3>';
  s+=ts.length?'<ul class="list">'+ts.map(taskItem).join("")+"</ul>":'<p class="none">Nenhuma tarefa vence neste dia.</p>';
  s+='<form class="add" data-form="addcal"><input type="text" id="add-cal" placeholder="Nova tarefa para este dia" aria-label="Nova tarefa para este dia"><button class="btn pri">Adicionar</button></form></section>';
  var rs=state.routines.slice().sort(function(a,b){return toMin(a.start)-toMin(b.start)}),wd=d.getDay();
  var act=rs.filter(function(r){return r.days.indexOf(wd)>=0}),oth=rs.filter(function(r){return r.days.indexOf(wd)<0});
  s+='<section class="sec"><h3>Rotinas do dia</h3>';
  s+=act.length?'<ul class="list">'+act.map(function(r){return routineItem(r,sel)}).join("")+"</ul>":'<p class="none">Nenhuma rotina neste dia da semana.</p>';
  s+='<form class="add" data-form="addr"><input type="text" id="add-r" placeholder="Nova rotina" aria-label="Nova rotina"><input type="time" id="add-r-time" value="08:00" aria-label="Horário"><button class="btn pri">Adicionar</button></form></section>';
  if(oth.length)s+='<section class="sec"><h3>Rotinas de outros dias</h3><ul class="list">'+oth.map(function(r){return routineItem(r,sel)}).join("")+"</ul></section>";
  return s;
}
function drawPanel(){$("panel").innerHTML=ui.view==="circles"?panelCircles():panelCal()}
function drawStage(){
  if(ui.view==="circles"){
    drawCircles(cur);
    $("under").innerHTML='<p class="hint">'+(ui.focus===null?"Toque em um anel para ampliar. Toque em uma tarefa para ver os detalhes.":'<button class="btn" data-act="unfocus">Ver todos os anéis</button>')+"</p>";
  }else{
    drawCal();
    var pm=(ui.cal.m+11)%12,nm=(ui.cal.m+1)%12;
    $("under").innerHTML='<div class="calnav"><button class="btn" data-act="calnav" data-dir="-1">‹ '+MES[pm]+'</button><button class="btn" data-act="caltoday">Hoje</button><button class="btn" data-act="calnav" data-dir="1">'+MES[nm]+" ›</button></div>"+
      '<p class="hint" style="margin-top:10px">Fora: os dias do mês. No meio: as 24 horas do dia escolhido, com as rotinas. Dentro: os meses.</p>';
  }
  $("stage").setAttribute("aria-label",ui.view==="circles"?"Círculos de prioridade":"Calendário circular");
}
function renderAll(){
  $("tab-circles").setAttribute("aria-pressed",ui.view==="circles");
  $("tab-cal").setAttribute("aria-pressed",ui.view==="cal");
  if(ui.view==="circles")cur=targetW();
  drawStage();drawPanel();
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,t,r;
  if(a==="view"){ui.view=el.dataset.v;ui.open=null;ui.openR=null;renderAll()}
  else if(a==="custom"){var ci=+el.dataset.ring;ui.custom=ui.custom===ci?null:ci;drawPanel()}
  else if(a==="gcolor"){state.rings[+el.dataset.ring].color=+el.dataset.c;cfgChanged()}
  else if(a==="maxc"){state.maxc=Math.max(Math.max(1,inRing(0).length),Math.min(5,state.maxc+(+el.dataset.d)));cfgChanged()}
  else if(a==="gadd"){
    var gi=+el.dataset.ring; if(N>=6)return;
    var used=state.rings.map(function(x){return x.color}),nc=[0,1,2,3,4,5].filter(function(x){return used.indexOf(x)<0})[0];
    state.tasks.forEach(function(x){if(x.ring>gi)x.ring++});
    state.rings.splice(gi+1,0,{name:"",desc:"",color:nc===undefined?(gi+1)%6:nc});
    ui.custom=gi+1;ui.focus=gi+1;ui.open=null;cfgChanged();
    toast("Anel criado. Dê um nome a ele.");
  }
  else if(a==="gdel"){
    var di=+el.dataset.ring; if(di<1||N<=2)return;
    var last=di===N-1;
    state.tasks.forEach(function(x){if(x.ring>di||(x.ring===di&&last))x.ring--});
    state.rings.splice(di,1);
    ui.custom=null;ui.open=null;ui.focus=Math.min(di,N-2);cfgChanged();
    toast("Anel removido. As tarefas dele foram para "+rname(ui.focus)+".");
  }
  else if(a==="greset"){state.rings=JSON.parse(JSON.stringify(DEF_RINGS));state.maxc=3;ui.custom=null;ui.open=null;cfgChanged();toast("Anéis de volta ao padrão.")}
  else if(a==="export"){doExport()}
  else if(a==="import"){$("imp").click()}
  else if(a==="pdf"){doPdf()}
  else if(a==="pdfdone"){doPdf("done")}
  else if(a==="synctoggle"){Sync.show=!Sync.show;drawSync()}
  else if(a==="syncnow"){syncNow(true)}
  else if(a==="syncoff"){syncConfig("sync/config","off")}
  else if(a==="syncuse"){syncConfig("sync/config",el.dataset.path)}
  else if(a==="syncpick"){toast("Escolha a pasta na janela que abriu.");syncConfig("sync/choose","")}
  else if(a==="focus"){setFocus(+el.dataset.ring)}
  else if(a==="unfocus"){if(ui.focus!==null)setFocus(ui.focus)}
  else if(a==="open"){
    t=task(id); if(!t)return;
    ui.open=ui.open===id?null:id;
    if(ui.view==="circles"&&ui.focus!==t.ring&&ui.open)setFocus(t.ring,true); else{drawStage();drawPanel()}
    if(ui.open&&el.dataset.from==="stage"){var it=$("it-"+id);if(it)it.scrollIntoView({block:"nearest",behavior:"smooth"})}
  }
  else if(a==="done"){t=task(id);if(t){t.done=true;t.doneAt=Date.now();if(ui.open===id)ui.open=null;save();drawStage();drawPanel();toast("Concluída. Dá para desfazer na lista de concluídas.")}}
  else if(a==="undo"){t=task(id);if(t){t.done=false;t.doneAt=0;if(t.ring===0&&centerFull())t.ring=1;save();drawStage();drawPanel()}}
  else if(a==="cleardone"){state.tasks=state.tasks.filter(function(x){return !x.done});save();drawPanel()}
  else if(a==="in"){move(id,-1)}
  else if(a==="out"){move(id,1)}
  else if(a==="del"){state.tasks=state.tasks.filter(function(x){return x.id!==id});ui.open=null;save();drawStage();drawPanel()}
  else if(a==="clearex"){state.tasks=state.tasks.filter(function(x){return !x.ex});state.routines=state.routines.filter(function(x){return !x.ex});state.examples=false;ui.open=null;ui.openR=null;save();renderAll()}
  else if(a==="keepex"){state.tasks.forEach(function(x){delete x.ex});state.routines.forEach(function(x){delete x.ex});state.examples=false;save();drawPanel()}
  else if(a==="day"){ui.cal.sel=el.dataset.d;ui.open=null;drawStage();drawPanel()}
  else if(a==="month"){ui.cal.m=+el.dataset.m;drawStage()}
  else if(a==="calnav"){var nd=new Date(ui.cal.y,ui.cal.m+(+el.dataset.dir),1);ui.cal.y=nd.getFullYear();ui.cal.m=nd.getMonth();drawStage()}
  else if(a==="caltoday"){var n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth(),sel:today()};drawStage();drawPanel()}
  else if(a==="openr"){ui.openR=ui.openR===id?null:id;drawPanel();if(ui.openR&&el.closest("svg")){var ir=$("ir-"+id);if(ir)ir.scrollIntoView({block:"nearest",behavior:"smooth"})}}
  else if(a==="rdone"){var l=state.log[ui.cal.sel]||(state.log[ui.cal.sel]=[]),ix=l.indexOf(id);if(ix>=0)l.splice(ix,1);else l.push(id);save();drawStage();drawPanel()}
  else if(a==="rday"){r=routine(id);if(r){var d=+el.dataset.d,k=r.days.indexOf(d);if(k>=0)r.days.splice(k,1);else r.days.push(d);save();drawStage();drawPanel()}}
  else if(a==="rdel"){state.routines=state.routines.filter(function(x){return x.id!==id});ui.openR=null;save();drawStage();drawPanel()}
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("g.bub")){e.preventDefault();e.target.closest("g.bub").dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form]"); if(!f)return; e.preventDefault();
  var kind=f.dataset.form,inp=f.querySelector("input[type=text]"),v=inp.value;
  if(kind==="add"){if(addTask(v,+f.dataset.ring)){drawStage();drawPanel();var again=$("add-"+f.dataset.ring);if(again)again.focus()}}
  else if(kind==="addcal"){if(addTask(v,ringForDue(ui.cal.sel),ui.cal.sel)){drawStage();drawPanel();toast("Adicionada em "+rname(ringForDue(ui.cal.sel))+".")}}
  else if(kind==="addr"){v=v.trim();if(!v)return;var wd=parse(ui.cal.sel).getDay(),nr={id:uid(),title:v,start:$("add-r-time").value||"08:00",dur:30,days:[wd]};state.routines.push(nr);ui.openR=nr.id;save();drawStage();drawPanel()}
});
function onField(e,final){
  var el=e.target; if(!el.dataset||!el.dataset.field)return;
  var f=el.dataset.field,id=el.dataset.id;
  if(el.dataset.kind==="g"){
    var gi=+el.dataset.ring; if(final||!RINGS[gi])return;
    RINGS[gi][f]=el.value; save(); drawStage();
    if(f==="name")document.querySelectorAll('[data-rname="'+gi+'"]').forEach(function(n){n.textContent=rname(gi)});
    return;
  }
  if(el.dataset.kind==="t"){
    var t=task(id); if(!t)return;
    if(f==="due"){if(!final)return;t.due=el.value;save();drawStage();drawPanel();return}
    if(final)return;
    t[f]=el.value; save();
    if(f==="title"){document.querySelectorAll('[data-ttl="'+id+'"]').forEach(function(n){n.textContent=el.value});drawStage()}
  }else{
    var r=routine(id); if(!r||final)return;
    r[f]=f==="dur"?Math.max(5,Math.min(1440,+el.value||5)):el.value; save();
    if(f==="title")document.querySelectorAll('[data-rtl="'+id+'"]').forEach(function(n){n.textContent=el.value});
    drawStage();
  }
}
document.addEventListener("input",function(e){onField(e,false)});
document.addEventListener("change",function(e){onField(e,true)});
$("imp").addEventListener("change",function(){
  var f=this.files&&this.files[0],inp=this; if(!f)return;
  f.text().then(importText,function(){toast("Não foi possível ler o arquivo.")}).then(function(){inp.value=""});
});
setInterval(function(){if(ui.view==="cal"&&!document.hidden)drawCal()},60000);

snapshot();
renderAll();
connect();
window.OrbitaAPI={tasks:function(){return state.tasks},save:function(){save();drawStage();drawPanel()},add:function(o){var ts=Date.now(),t={id:o.id||uid(),title:String(o.title||""),notes:String(o.notes||""),ring:2,due:o.due||"",done:false,doneAt:0,created:ts,placed:ts};state.tasks.push(t);return t},open:function(id){if(!task(id))return;ui.view="circles";ui.open=id;drawStage();drawPanel()}};
syncInit();
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.claude&&location.hostname!=="127.0.0.1")navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
})();
</script>
